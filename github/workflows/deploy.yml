name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "50 4,10,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install numpy pygrib || (sudo apt-get update && sudo apt-get install -y libeccodes-dev && pip install numpy pygrib)

      - name: Self test
        run: python pipeline/selftest.py

      - name: Fetch weather data
        continue-on-error: true
        run: python pipeline/fetch_gfs.py --out site/data/gfs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
